<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批發採購系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登入視圖 -->
  <div id="login-view">
    <h2>批發採購系統</h2>
    <input type="email" id="auth-email" placeholder="帳號 (Email)">
    <input type="password" id="auth-password" placeholder="密碼">
    <button id="login-btn" class="btn-orange">登入</button>
  </div>

  <!-- 主應用視圖 -->
  <div id="app-view">
    <div class="header">
      <h2>批發採購報價單</h2>
      <div style="display: flex; gap: 15px; align-items: center;">
        <span id="user-info"></span>
        <button id="admin-btn" class="btn-orange" onclick="loadAdminPanel()" style="display: none; background: #dc3545;">後台管理</button>
        <button class="btn-orange" onclick="showAppView()" style="padding: 5px 10px;">返回購物</button>
        <button class="btn-orange" onclick="loadMyOrders()" style="padding: 5px 10px;">我的訂單</button>
        <button class="btn-orange" onclick="logout()" style="background: #6c757d;">登出</button>
      </div>
    </div>

  <div class="layout-body">
      <!-- 左側分類選單 -->
      <div class="sidebar" id="category-sidebar" style="overflow-y: auto; max-height: calc(100vh - 100px);">
        <button class="category-btn sidebar-btn active" onclick="switchCategory(this, '日用品')">日用品</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '家居軟裝')">家居軟裝</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '寵物用品')">寵物用品</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '行李箱包')">行李箱包</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '機能包')">機能包</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '輕奢女包')">輕奢女包</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '輕奢飾品')">輕奢飾品</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '學生文具')">學生文具</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '女裝')">女裝</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '男裝')">男裝</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '展店用品')">展店用品</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '辦公文具')">辦公文具</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '五金-手工具')">五金-手工具</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '家用五金')">家用五金</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '3C配件')">3C配件</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '家電')">家電</button>
        <button class="category-btn sidebar-btn" onclick="switchCategory(this, '傳統節慶')">傳統節慶</button>
      </div>
    <div class="product-grid" id="product-grid">
        <!-- 產品卡片由 JS 動態生成 -->
    </div>
  </div>

  <div class="cart-bar">
    <div>已選項目：<span id="cart-total-qty">0</span> 件 | 總計(未稅)：$<span id="cart-total-amount">0</span></div>
    <div style="display: flex; gap: 10px;">
      <button class="btn-orange" onclick="openCartModal()" style="background: #17a2b8;">查看採購車</button>
      <button class="btn-orange" id="checkout-btn">前往結帳</button>
    </div>
  </div>
  </div>

  <!-- 結帳與匯款視圖 (預設隱藏) -->
  <div id="checkout-view" style="display: none; padding: 2rem; max-width: 600px; margin: 50px auto; background: var(--bg-white); border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2>訂單已成立</h2>
  <div id="checkout-summary" style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
  <!-- 動態插入訂單摘要 -->
  </div>
    
  <!-- 門檻 > $500：顯示匯款表單 -->
  <div id="remittance-form" style="display: none; display: flex; flex-direction: column; gap: 10px;">
    <h3>填寫匯款資料</h3>
    <p style="color: #666; font-size: 0.9em;">收款銀行：000 (測試銀行) / 帳號：1234567890</p>
    <input type="text" id="bank-last-5" placeholder="匯款帳號後 5 碼 (必填)" maxlength="5" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    <input type="text" id="tax-id" placeholder="統一編號 (非必填)" maxlength="8" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    <button class="btn-orange" id="submit-remittance-btn">確認送出匯款資訊</button>
  </div>

    <!-- 門檻 <= $500：顯示黃字警告 -->
    <div id="low-amount-warning" style="display: none; color: #856404; background: #fff3cd; padding: 15px; border-radius: 4px; font-weight: bold;">
      ⚠️ 該訂單未達預付貨款門檻，入庫後連同運費合併結帳。
    </div>

    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px; cursor: pointer; width: 100%;">返回購物 / 查看我的訂單</button>
    </div>

    <!-- 我的訂單視圖 (預設隱藏) -->
    <div id="orders-view" style="display: none; padding: 2rem; max-width: 800px; margin: 20px auto; background: var(--bg-white); border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
      
      <!-- 標題與返回按鈕列 -->
      <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
        <button class="btn-orange" onclick="showAppView()" style="background: #6c757d; padding: 6px 12px; font-size: 0.9em;">⬅ 返回上一頁</button>
        <h2 style="margin: 0;">我的訂單</h2>
      </div>
      
      <!-- 狀態標籤分頁 (加入 order-tab-btn 與 switchOrderTab) -->
      <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
        <button class="category-btn order-tab-btn active" style="width: auto;" onclick="switchOrderTab(this, '未付款')">未付款</button>
        <button class="category-btn order-tab-btn" style="width: auto;" onclick="switchOrderTab(this, '進行中')">進行中 (含待審核)</button>
        <button class="category-btn order-tab-btn" style="width: auto;" onclick="switchOrderTab(this, '完成')">完成訂單</button>
      </div>

      <!-- 訂單列表容器 -->
      <div id="orders-list-container">
        <!-- JS 動態生成訂單卡片 -->
      </div>
    </div>
    
  <!-- 管理員後台視圖 (預設隱藏) -->
  <div id="admin-view" style="display: none; padding: 2rem; max-width: 900px; margin: 20px auto; background: var(--bg-white); border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
    <h2 style="color: #dc3545;">管理員後台</h2>

    <div style="margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
      <button class="category-btn active" style="width: auto;">訂單管理 (運費與核帳)</button>
      <!-- 帳號管理預留位置 -->
    </div>

    <div id="admin-orders-container">
      <!-- JS 動態生成後台訂單列表 -->
    </div>
  </div>

  <!-- 商品詳情彈窗 -->
  <div id="product-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-body">
        <img id="modal-img" src="" alt="商品圖片">
        <div class="modal-info">
          <h3 id="modal-name" style="margin-top:0;">商品名稱</h3>
          <p id="modal-desc" style="color: #666; font-size: 0.9em; flex-grow: 1;">商品介紹內容...</p>
          <!-- 動態規格與屬性容器 (有資料才顯示) -->
          <div id="modal-attributes" style="margin: 10px 0; font-size: 0.88em; background: #f8f9fa; border-radius: 6px; padding: 10px; border: 1px solid #eee;">
            <!-- JS 動態插入屬性 -->
          </div>
          <div id="modal-price" style="color: #ee4d2d; font-size: 1.6em; font-weight: bold; margin: 15px 0;">$0</div>
          <div id="modal-specs">
            <!-- JS 動態生成規格選項 -->
          </div>
          <!-- 商品採購數量選擇 -->
          <div style="display: flex; align-items: center; gap: 15px; margin-top: 15px;">
            <span style="color: #666; font-size: 0.9em;">採購數量</span>
            <div style="display: flex; align-items: center; border: 1px solid #ccc; border-radius: 4px; overflow: hidden;">
              <button onclick="changeModalQty(-1)" style="padding: 5px 15px; background: #f8f9fa; border: none; cursor: pointer; font-size: 1.2em; border-right: 1px solid #ccc;">-</button>
              <input type="number" id="modal-qty-input" value="0" min="0" oninput="onModalQtyInputChange(this)" style="width: 50px; text-align: center; border: none; outline: none; font-size: 1.1em; background: #fff;">
              <button onclick="changeModalQty(1)" style="padding: 5px 15px; background: #f8f9fa; border: none; cursor: pointer; font-size: 1.2em; border-left: 1px solid #ccc;">+</button>
            </div>
          </div>
          <button class="btn-orange" onclick="addToCartFromModal()" style="width: 100%; padding: 12px; font-size: 1.1em; margin-top: 20px; border-radius: 4px; background: #ee4d2d;">加入採購車</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 採購車明細彈窗 -->
  <div id="cart-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
      <span class="close-btn" onclick="closeCartModal()">&times;</span>
      <h3 style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;">採購車明細</h3>
      <div id="cart-items-container" style="max-height: 50vh; overflow-y: auto; margin-bottom: 15px; padding-right: 5px;">
        <!-- JS 動態生成購物車內容 -->
      </div>
      <div style="text-align: right; font-weight: bold; font-size: 1.2em; border-top: 2px solid #eee; padding-top: 15px;">
        總計(含稅): $<span id="cart-modal-total">0</span>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
